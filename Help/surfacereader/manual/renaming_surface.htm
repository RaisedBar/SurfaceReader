    <body>
        <h3><a name="_Toc323208706"></a><a name="kanchor24"></a>Renaming a Surface.</h3>
        <ol start="1" class="ol_1">
            <li value="1">Highlight the surface that you want to rename in the Surfaces list.</li>
            <li value="2">Bring up the Surfaces menu and choose Rename…, or just press F2 from the Surfaces list.</li>
            <li value="3">Type in a new name.</li>
            <li value="4">Tab to the OK button and press Enter.</li>
        </ol>
